<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page register-page">

<div class="login-container register-container">

    <div class="login-card">

        <div class="login-logo">
            🎓
        </div>

        <h1>Create Account</h1>
        <p class="login-subtitle">Register to access the Student Management System</p>

        <form id="registerForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regEmail">Email</label>
                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regUsername">Username</label>
                <input
                    type="text"
                    id="regUsername"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="regPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePasswordField('regPassword')">
                        👁
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePasswordField('confirmPassword')">
                        👁
                    </button>
                </div>
            </div>

            <div id="registerMessage" class="form-message" role="alert"></div>

            <label class="terms-row">
                <input type="checkbox" id="terms">
                I agree to the Terms &amp; Conditions
            </label>

            <button type="submit" class="btn btn-primary btn-full">
                Register
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="login-footer">
            © 2026 Student Management System
        </p>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
